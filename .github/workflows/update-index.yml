name: Update paper archive

on:
  push:
    branches: [main]
    paths:
      - 'reviews/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'requirements.txt'
      - '.github/workflows/update-index.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reviews/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'requirements.txt'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      # A stale index is expected when a new review is pushed.
      - run: python scripts/update_index.py

  update:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_index.py
      - name: Commit the archive only when changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Archive is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs: update paper archive [skip ci]"
          git push origin HEAD:main
