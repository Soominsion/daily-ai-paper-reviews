<svg xmlns="http://www.w3.org/2000/svg" width="2640" height="1720" viewBox="0 0 2640 1720"><title>DeepSeek-VL-7B: SigLIP-L and SAM-B image features connected through a hybrid MLP adaptor</title><desc>Same image, two encoders, SAM feature interpolation and convolution, separate projections, feature concatenation, shared projection, visual and text tokens to DeepSeek LLM. Official released 7B checkpoint configuration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect x="0" y="0" width="2640" height="1720" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="65" y="85" fill="#172B45" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="46" font-weight="700" text-anchor="start">DeepSeek-VL-7B: 두 vision encoder의 정보를 하나의 입력으로</text><text x="70" y="137" fill="#60718A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="400" text-anchor="start">초기 DeepSeek-VL (2024) · 공식 공개 7B checkpoint 기준 · 배치 차원과 일부 정규화 생략</text><rect x="65" y="170" width="2500" height="75" fill="#F6F8FC" stroke="none" stroke-width="2" /><polygon points="95,187 155,187 170,229 80,229" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="190" y="218" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="700" text-anchor="start">사다리꼴: 처리 모듈 / 연산</text><polygon points="815,187 900,187 885,229 800,229" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="925" y="218" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="700" text-anchor="start">평행사변형: 이미지 / feature / token</text><text x="1880" y="218" fill="#475569" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="400" text-anchor="start">실선 화살표: 데이터 흐름</text><rect x="345" y="280" width="1020" height="1090" fill="#FAFCFF" stroke="#B8C8DB" stroke-width="2" stroke-dasharray="8 6" /><text x="375" y="325" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" font-weight="700" text-anchor="start">1  Hybrid vision encoder</text><rect x="1400" y="280" width="1185" height="920" fill="#FCFAFF" stroke="#CFC1DF" stroke-width="2" stroke-dasharray="8 6" /><text x="1430" y="325" fill="#72439C" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" font-weight="700" text-anchor="start">2  Hybrid MLP adaptor</text><polygon points="89,600 305,600 281,765 65,765" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="185.0" y="639" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">동일한 이미지</text><text x="185.0" y="678" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">두 해상도로</text><text x="185.0" y="710" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">입력 준비</text><polyline points="305,680 325,680 325,440 390,440" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="305,680 325,680 325,775 390,775" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="414,365 676,365 700,515 390,515" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="545.0" y="404" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">SigLIP-L</text><text x="545.0" y="443" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">384 × 384 입력</text><text x="545.0" y="475" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">의미적 feature 추출</text><polyline points="700,440 840,440" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="864,365 1140,365 1116,515 840,515" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="990.0" y="404" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Low-res feature</text><text x="990.0" y="443" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">24 × 24 × 1024</text><text x="990.0" y="475" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576 × 1024</text><polyline points="1140,440 1450,440" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="414,700 676,700 700,850 390,850" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="545.0" y="739" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" text-anchor="middle">SAM-B image encoder</text><text x="545.0" y="778" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1024 × 1024 입력</text><text x="545.0" y="810" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">세부 feature 추출</text><polyline points="700,775 840,775" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="864,700 1140,700 1116,850 840,850" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="990.0" y="739" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">SAM feature map</text><text x="990.0" y="778" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">64 × 64 × 256</text><polyline points="990,850 990,960" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="864,960 1116,960 1140,1120 840,1120" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="990.0" y="999" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Interpolation</text><text x="990.0" y="1033" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">bilinear</text><text x="990.0" y="1065" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">64 × 64 → 96 × 96</text><text x="990.0" y="1097" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">channel 수 256 유지</text><polyline points="840,1040 700,1040" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="414,960 676,960 700,1120 390,1120" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="545.0" y="999" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Conv × 2 · stride 2</text><text x="545.0" y="1038" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">96 → 48 → 24</text><text x="545.0" y="1070" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">256 → 512 → 1024</text><polyline points="545,1120 545,1200" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="414,1200 700,1200 676,1345 390,1345" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="545.0" y="1239" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">High-res feature</text><text x="545.0" y="1278" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">24 × 24 × 1024</text><text x="545.0" y="1310" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576 × 1024</text><polyline points="700,1272 1270,1272 1270,1080 1450,1080" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="850" y="1180" fill="#60718A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="400" text-anchor="middle">공간 격자를 24 × 24로 맞춤</text><polygon points="1474,365 1746,365 1770,515 1450,515" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="1610.0" y="404" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Low-res Linear</text><text x="1610.0" y="443" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1024 → 2048</text><text x="1610.0" y="475" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576 × 2048</text><polygon points="1474,1005 1746,1005 1770,1155 1450,1155" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="1610.0" y="1044" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">High-res Linear</text><text x="1610.0" y="1083" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1024 → 2048</text><text x="1610.0" y="1115" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576 × 2048</text><polyline points="1770,440 1825,440 1825,760 1880,760" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="1770,1080 1825,1080 1825,760 1880,760" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="1904,680 2156,680 2180,840 1880,840" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="2030.0" y="719" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Concatenate</text><text x="2030.0" y="753" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">feature 차원으로 결합</text><text x="2030.0" y="785" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576 × 4096</text><text x="2030.0" y="817" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">token 수는 576 유지</text><polyline points="2180,760 2260,760" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="2284,680 2536,680 2560,840 2260,840" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="2410.0" y="719" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Shared MLP</text><text x="2410.0" y="758" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">GeLU + Linear</text><text x="2410.0" y="790" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">4096 → 4096</text><polyline points="2410,840 2410,1005" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="2284,1005 2560,1005 2536,1155 2260,1155" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="2410.0" y="1044" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Visual tokens</text><text x="2410.0" y="1083" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576개 · 각 4096차원</text><text x="2410.0" y="1115" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">576 × 4096</text><text x="1450" y="1285" fill="#60718A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="start">질문 → tokenizer / embedding</text><polygon points="1474,1340 1770,1340 1746,1490 1450,1490" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="1610.0" y="1379" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Text embeddings</text><text x="1610.0" y="1418" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">T개 · 각 4096차원</text><polyline points="1770,1415 1880,1415" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="1904,1340 2156,1340 2180,1490 1880,1490" fill="#EAF2FF" stroke="#3569A8" stroke-width="3" /><text x="2030.0" y="1379" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">DeepSeek LLM-7B</text><text x="2030.0" y="1418" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">이미지 + 질문 처리</text><text x="2030.0" y="1450" fill="#234A77" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">RoPE: token 순서 반영</text><polyline points="2410,1155 2410,1260 2030,1260 2030,1340" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="2180,1415 2260,1415" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)" /><polygon points="2284,1340 2560,1340 2536,1490 2260,1490" fill="#ECF8F3" stroke="#278267" stroke-width="3" /><text x="2410.0" y="1379" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" font-weight="700" text-anchor="middle">출력</text><text x="2410.0" y="1418" fill="#19624E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="middle">텍스트 답변 / 코드 등</text><text x="70" y="1540" fill="#172B45" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" font-weight="400" text-anchor="start">SAM의 prompt encoder와 mask decoder는 이 경로에 사용하지 않는다. 1.3B 모델은 SigLIP만 사용한다.</text><text x="70" y="1590" fill="#60718A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="400" text-anchor="start">Interpolation은 주변 feature 값으로 새 격자를 계산한다. 원본에 없던 세부 정보를 새로 관측하는 연산이 아니다.</text><text x="70" y="1638" fill="#60718A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" text-anchor="start">공개 7B 설정은 경로별 Linear 이후 결합한다. 논문의 원시 feature 결합 설명(1024 + 1024 = 2048)과 구분한다.</text><text x="70" y="1688" fill="#7A879A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="400" text-anchor="start">자료: DeepSeek-VL §3.1 / 공식 sam.py, clip_encoder.py, projector.py / deepseek-vl-7b-base config.json</text></svg>